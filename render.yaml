services:
  - type: web
    name: regwatch-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "RegWatch Bangladesh"
      - key: APP_VERSION
        value: "1.0.0"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: DATABASE_URL
        fromDatabase:
          name: regwatch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: regwatch-db
    plan: free
    region: singapore
    databaseName: regwatch
    user: regwatch

